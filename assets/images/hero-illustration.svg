<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="auto" fill="none" role="img" aria-label="Illustration of international students embarking on their journey in Taiwan">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF4ED"/>
      <stop offset="100%" stop-color="#EAF3F2"/>
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D7A73"/>
      <stop offset="100%" stop-color="#1B554F"/>
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9BE7C"/>
      <stop offset="100%" stop-color="#F48A54"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" rx="20" fill="url(#skyGrad)"/>

  <!-- Warm Sun / Auspicious Aura -->
  <circle cx="430" cy="120" r="60" fill="url(#warmSun)" opacity="0.85"/>

  <!-- Distant Mountain Silhouettes -->
  <path d="M-20 280C50 240 120 250 180 220C240 190 320 230 400 200C480 170 540 210 620 190V360H-20V280Z" fill="#C8DBD7" opacity="0.5"/>
  <path d="M-20 310C60 260 160 270 230 250C310 230 380 260 460 240C520 220 570 240 620 230V380H-20V310Z" fill="#88B8B1" opacity="0.6"/>

  <!-- Iconic Taipei 101 Silhouette in background -->
  <g fill="#24645E" opacity="0.45">
    <rect x="335" y="105" width="2" height="28"/>
    <rect x="332" y="133" width="8" height="6" rx="1"/>
    <!-- Stack segments -->
    <path d="M331 139H341L343 150H329L331 139Z"/>
    <path d="M330 151H342L344 163H328L330 151Z"/>
    <path d="M329 164H343L345 177H327L329 164Z"/>
    <path d="M328 178H344L346 192H326L328 178Z"/>
    <path d="M327 193H345L347 208H325L327 193Z"/>
    <path d="M326 209H346L348 225H324L326 209Z"/>
    <rect x="322" y="226" width="28" height="70" rx="2"/>
  </g>

  <!-- Green Foreground Hills / Campus Lawn -->
  <path d="M-10 330C100 290 220 300 320 320C420 340 500 310 610 325V400H-10V330Z" fill="url(#hillGrad)"/>

  <!-- Campus Gateway / Arch Motif -->
  <path d="M70 330V270C70 260 80 255 90 255H140C150 255 160 260 160 270V330" stroke="#FFF7F0" stroke-width="4" stroke-linecap="round"/>
  <rect x="62" y="250" width="106" height="7" rx="3" fill="#C85A32"/>
  <circle cx="115" cy="275" r="7" fill="#FCE5B8"/>

  <!-- Student Figures with Backpack & Books -->
  <!-- Student 1 (Forward looking, waving) -->
  <g transform="translate(200, 245)">
    <!-- Head & Hair -->
    <circle cx="30" cy="15" r="11" fill="#422918"/>
    <path d="M22 15C22 9 38 7 38 15C38 17 35 19 30 19C25 19 22 17 22 15Z" fill="#1C1510"/>
    <!-- Body / Jacket -->
    <path d="M19 27C19 26 23 25 30 25C37 25 41 26 41 27L45 55H15L19 27Z" fill="#C85A32"/>
    <!-- Backpack -->
    <rect x="12" y="29" width="8" height="20" rx="3" fill="#205B54"/>
    <!-- Waving Arm -->
    <path d="M41 30L52 18" stroke="#FCE0CB" stroke-width="4" stroke-linecap="round"/>
    <circle cx="53" cy="16" r="3" fill="#FCE0CB"/>
    <!-- Legs -->
    <path d="M24 55V85" stroke="#25211E" stroke-width="5" stroke-linecap="round"/>
    <path d="M36 55V85" stroke="#25211E" stroke-width="5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="23" cy="87" rx="5" ry="3" fill="#994626"/>
    <ellipse cx="37" cy="87" rx="5" ry="3" fill="#994626"/>
  </g>

  <!-- Student 2 (Holding study notes/folder) -->
  <g transform="translate(260, 255)">
    <!-- Head -->
    <circle cx="28" cy="14" r="10" fill="#4B3322"/>
    <path d="M20 14C20 8 36 6 36 14C36 16 33 18 28 18C23 18 20 16 20 14Z" fill="#1F150E"/>
    <!-- Coat -->
    <path d="M18 25C18 24 22 23 28 23C34 23 38 24 38 25L42 52H14L18 25Z" fill="#E8F1F0"/>
    <!-- Folder in Hand -->
    <rect x="23" y="32" width="16" height="12" rx="2" fill="#D6744E" transform="rotate(-10 23 32)"/>
    <!-- Legs -->
    <path d="M22 52V80" stroke="#2D3B48" stroke-width="5" stroke-linecap="round"/>
    <path d="M33 52V80" stroke="#2D3B48" stroke-width="5" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="21" cy="82" rx="5" ry="3" fill="#24645E"/>
    <ellipse cx="34" cy="82" rx="5" ry="3" fill="#24645E"/>
  </g>

  <!-- Floating Helpful Guide Icons / Cards -->
  <g transform="translate(420, 240)">
    <rect width="130" height="75" rx="10" fill="#FFFFFF" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.06))"/>
    <circle cx="28" cy="28" r="14" fill="#FDF1EC"/>
    <!-- Mini graduation cap -->
    <path d="M21 27L28 23L35 27L28 31L21 27Z" fill="#C85A32"/>
    <path d="M24 29V34C24 35 28 36 28 36C28 36 32 35 32 34V29" stroke="#C85A32" stroke-width="1.5" fill="none"/>
    <rect x="50" y="20" width="65" height="7" rx="3" fill="#2B2621"/>
    <rect x="50" y="32" width="45" height="5" rx="2.5" fill="#8C837A"/>
    <rect x="18" y="52" width="95" height="5" rx="2.5" fill="#EAE5DE"/>
    <rect x="18" y="61" width="70" height="5" rx="2.5" fill="#EAE5DE"/>
  </g>

</svg>
